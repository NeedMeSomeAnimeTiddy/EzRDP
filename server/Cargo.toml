[package]
name = "ezrdp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
openh264 = "0.9.8"
hmac = "0.13.0"
sha2 = "0.11.0"
getrandom = "0.4.3"
aes-gcm = "0.11.1"
igd-next = "0.18.0"
p256 = { version = "0.14.0", features = ["ecdh"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = "0.18.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Ole",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
]

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "remote_desktop", "screencast"] }
enumflags2 = "0.7.12"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
pipewire = "0.10"
pollster = "0.4"
x11rb = { version = "0.13", features = ["shm", "randr", "xtest"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
