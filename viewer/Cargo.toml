[package]
name = "ezrdp-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
openh264 = "0.9.8"
hmac = "0.13.0"
sha2 = "0.11.0"
getrandom = "0.4.3"
aes-gcm = "0.11.1"
p256 = { version = "0.14.0", features = ["ecdh"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = "0.18.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
