name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pc-server:
    name: PC server (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: server
        run: cargo test --release
      - name: Build
        working-directory: server
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: EzRDP-PC
          path: server/target/release/ezrdp-server.exe

  pc-server-linux:
    name: PC server (Linux)
    # Older Ubuntu so the program also runs on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: server
        run: cargo test --release
      - name: Build
        working-directory: server
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: EzRDP-PC-Linux
          path: server/target/release/ezrdp-server

  viewer-windows:
    name: Viewer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: viewer
        run: cargo test --release
      - name: Build
        working-directory: viewer
        run: |
          cargo build --release
          copy target\release\ezrdp-viewer.exe EzRDP-Viewer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: EzRDP-Viewer-Windows
          path: viewer/EzRDP-Viewer.exe

  viewer-linux:
    name: Viewer (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libgl1-mesa-dev libx11-dev
      - name: Test
        working-directory: viewer
        run: cargo test --release
      - name: Build
        working-directory: viewer
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: EzRDP-Viewer-Linux
          path: viewer/target/release/ezrdp-viewer

  android-app:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk EzRDP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EzRDP-Android
          path: android/EzRDP.apk

  release:
    name: Publish download
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pc-server, pc-server-linux, viewer-windows, viewer-linux, android-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "EzRDP ${{ github.ref_name }}"
          EzRDP-PC/ezrdp-server.exe EzRDP-Android/EzRDP.apk EzRDP-Viewer-Windows/EzRDP-Viewer.exe
          EzRDP-PC-Linux/ezrdp-server#ezrdp-server-linux EzRDP-Viewer-Linux/ezrdp-viewer#ezrdp-viewer-linux
