name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the build still running for the older one. Only the
# newest needs publishing, and two pushes in the same minute would get the same build number.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One build number for all three apps: the apps compare it with the newest release to know
  # when there's an update. Minutes since Sept 2025, like the phone app's version code.
  version:
    name: Build number
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.n.outputs.build }}
    steps:
      - id: n
        run: echo "build=$(( $(date +%s) / 60 - 29270000 ))" >> "$GITHUB_OUTPUT"

  pc-server:
    name: PC app (Windows)
    needs: version
    runs-on: windows-latest
    env:
      EZRDP_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: server
        run: cargo test --release
      - name: Build
        working-directory: server
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: EzRDP-PC
          path: server/target/release/ezrdp-server.exe

  pc-server-linux:
    name: PC app (Linux)
    needs: version
    runs-on: ubuntu-24.04
    env:
      EZRDP_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libgl1-mesa-dev libx11-dev libpipewire-0.3-dev clang
      - name: Test
        working-directory: server
        run: cargo test --release
      - name: Build
        working-directory: server
        run: |
          cargo build --release
          cp target/release/ezrdp-server ezrdp-linux
      - uses: actions/upload-artifact@v4
        with:
          name: EzRDP-PC-Linux
          path: server/ezrdp-linux

  android-app:
    name: Android app
    needs: version
    runs-on: ubuntu-latest
    env:
      EZRDP_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Signing key
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.EZRDP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the EZRDP_KEYSTORE_BASE64 secret (Settings > Secrets and variables > Actions) so the app can install as an update."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > app/ezrdp.keystore
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk EzRDP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EzRDP-Android
          path: android/EzRDP.apk

  # Every push to main becomes the newest download, which the apps update themselves from.
  release:
    name: Publish download
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [version, pc-server, pc-server-linux, android-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD: ${{ needs.version.outputs.build }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
      - name: Update list
        run: |
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          cat > latest.json <<JSON
          {
            "build": $BUILD,
            "windows": { "file": "ezrdp-server.exe", "sha256": "$(sum EzRDP-PC/ezrdp-server.exe)" },
            "linux": { "file": "ezrdp-linux", "sha256": "$(sum EzRDP-PC-Linux/ezrdp-linux)" },
            "android": { "file": "EzRDP.apk", "sha256": "$(sum EzRDP-Android/EzRDP.apk)" }
          }
          JSON
          cat latest.json
      - name: Create release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="build-$BUILD"; fi
          gh release create "$tag" --repo "$REPO" --target "$GITHUB_SHA" --latest --title "EzRDP build $BUILD" \
            --notes "Automatic build from commit $GITHUB_SHA." \
            EzRDP-PC/ezrdp-server.exe EzRDP-Android/EzRDP.apk EzRDP-PC-Linux/ezrdp-linux latest.json
      - name: Remove old builds
        run: |
          # Keep the newest 5 automatic builds (tagged versions stay).
          gh release list --repo "$REPO" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r t; do gh release delete "$t" --repo "$REPO" --yes --cleanup-tag; done
